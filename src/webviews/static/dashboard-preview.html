<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Cluster dashboard preview</title>
        <style>
            :root {
                --vscode-button-background: #0e639c;
                --vscode-editor-background: #ffffff;
                --vscode-editor-foreground: #1f1f1f;
                --vscode-foreground: #3b3b3b;
                --vscode-sideBar-background: #f8f8f8;
                --vscode-editorWidget-background: #f3f3f3;
                --vscode-editorWidget-border: #d4d4d4;
                --vscode-panel-border: #d4d4d4;
                --vscode-widget-border: #d4d4d4;
                --vscode-focusBorder: #0090f1;
            }
            html,
            body,
            #root {
                height: 100%;
                margin: 0;
            }
            /* VS Code gives every webview body this horizontal padding; the view breaks out of it. */
            body {
                padding: 0 20px;
            }
        </style>
    </head>
    <body data-vscode-theme-kind="vscode-light">
        <div id="root"></div>
        <script type="module">
            import { render } from '/views.js';

            globalThis.l10n_bundle = {};

            window.config = {
                __initialData: encodeURIComponent(
                    JSON.stringify({
                        clusterId: 'preview',
                        clusterDisplayName: 'preview-cluster',
                        viewId: 'connectionsView',
                        refreshIntervalMs: 5000,
                        feedbackSignalsEnabled: true,
                    }),
                ),
            };

            const databases = [
                {
                    name: 'sample_mflix',
                    sizeOnDiskBytes: 111 * 1024 * 1024,
                    dataSizeBytes: 96 * 1024 * 1024,
                    indexSizeBytes: 60 * 1024 * 1024,
                    collections: 6,
                    objects: 175_000,
                    indexes: 24,
                },
                {
                    name: 'analytics',
                    sizeOnDiskBytes: 8 * 1024 * 1024,
                    dataSizeBytes: 6 * 1024 * 1024,
                    indexSizeBytes: 2.5 * 1024 * 1024,
                    collections: 5,
                    objects: 4100,
                    indexes: 14,
                },
            ];

            const responses = {
                'clusterDashboard.getClusterInfo': {
                    clusterDisplayName: 'preview-cluster',
                    hosts: ['preview-cluster.mongocluster.cosmos.azure.com:10260'],
                    authMethod: 'NativeAuth',
                    metadata: {
                        serverInfo_version: '8.0.5',
                        serverStatus_uptime: '99123',
                        topology_helloShape: 'replicaSet',
                    },
                },
                'clusterDashboard.getStorageStats': {
                    databases,
                    totalSizeBytes: 119 * 1024 * 1024,
                    omittedDatabaseCount: 0,
                    errors: [],
                },
                'clusterDashboard.getHealthSample': {
                    timestampMs: Date.now(),
                    pingLatencyMs: 12,
                    uptimeSeconds: 99_123,
                    connectionsCurrent: 4,
                    opcounters: { query: 10, insert: 2, update: 1, delete: 0, getmore: 3, command: 40 },
                    activeOperations: 1,
                    activeOperationsScope: 'cluster',
                    errors: [],
                },
                'clusterDashboard.getDatabaseCollections': {
                    collections: [
                        {
                            name: 'movies',
                            type: 'collection',
                            documents: 21_349,
                            sizeBytes: 12 * 1024 * 1024,
                            storageSizeBytes: 14 * 1024 * 1024,
                            indexSizeBytes: 3 * 1024 * 1024,
                            indexes: 5,
                        },
                    ],
                    errors: [],
                    omittedCollectionCount: 0,
                },
                'clusterDashboard.getCurrentOperations': {
                    operations: [],
                    history: [],
                    scope: 'cluster',
                    errors: [],
                },
            };

            const state = {};
            const reply = (id, result) => window.postMessage({ id, result }, '*');
            const complete = (id) => window.postMessage({ id, complete: true }, '*');

            render('clusterDashboard', {
                postMessage(message) {
                    const { id, op } = message ?? {};
                    if (!id || !op) return;
                    if (op.type === 'subscription.stop' || op.type === 'abort') return;
                    setTimeout(() => {
                        reply(id, responses[op.path] ?? null);
                        complete(id);
                    }, 40);
                },
                getState: () => state,
                setState: (next) => Object.assign(state, next),
            });
        </script>
    </body>
</html>
