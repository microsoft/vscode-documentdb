# Documentation site, rendered by GitHub Pages with the Just the Docs theme.
# Interim solution until the user manual moves to learn.microsoft.com.
# How it works and how to preview it: ai-and-plans/features/docs-site/README.md
remote_theme: just-the-docs/just-the-docs@v0.12.0

title: DocumentDB extension for Visual Studio Code
description: Learn more about the DocumentDB extension for Visual Studio Code, an open-source DocumentDB GUI and MongoDB GUI.
baseurl: '/vscode-documentdb'
url: 'https://microsoft.github.io'

plugins:
    - jekyll-remote-theme
    - jekyll-include-cache
    - jekyll-seo-tag
    - jekyll-sitemap
    - jekyll-redirect-from
    - jemoji

# Light by default; head_custom.html switches to dark when the OS prefers it.
color_scheme: light

search_enabled: true
search:
    heading_level: 2
    previews: 2
    preview_words_before: 3
    preview_words_after: 3
    rel_url: true

heading_anchors: true
back_to_top: true
back_to_top_text: 'Back to top'

aux_links:
    'GitHub':
        - 'https://github.com/microsoft/vscode-documentdb'
    'Marketplace':
        - 'https://marketplace.visualstudio.com/items?itemName=ms-azuretools.vscode-documentdb'
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: 'Edit this page on GitHub'
gh_edit_repository: 'https://github.com/microsoft/vscode-documentdb'
gh_edit_branch: 'main'
gh_edit_source: docs
gh_edit_view_mode: 'tree'

callouts:
    note:
        title: Note
        color: blue
    tip:
        title: Tip
        color: green
    warning:
        title: Warning
        color: yellow
    important:
        title: Important
        color: purple
    caution:
        title: Caution
        color: red

# The public site publishes only index.md, user-manual/ and release-notes/.
# Everything else under docs/ is contributor material and stays out of the site.
exclude:
    - Gemfile
    - Gemfile.lock
    - node_modules
    - ai-and-plans/
    - blog-posts/
    - atlas-mongodb-discovery-flow.md
    - index-advisor-data-flow.md
    - localization.md
    - query-generation-data-flow.md
