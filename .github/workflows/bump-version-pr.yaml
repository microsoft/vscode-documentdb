name: Bump version after release

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: write
    issues: write

concurrency:
    group: bump-version-after-release
    cancel-in-progress: false

jobs:
    bump:
        if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Bump version
              id: bump
              run: node .github/scripts/bump-version.cjs
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}

            - name: Prepare branch and reminder issue
              if: steps.bump.outputs.changed == 'true'
              run: node .github/scripts/prepare-version-reminder.cjs
              env:
                  GH_TOKEN: ${{ github.token }}
                  OLD_VERSION: ${{ steps.bump.outputs.old-version }}
                  NEW_VERSION: ${{ steps.bump.outputs.new-version }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  REMINDER_ASSIGNEE: tnaum-ms
