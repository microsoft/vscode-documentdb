name: Docs preview

# Builds the documentation site (docs/) the way GitHub Pages does and attaches it to the run as a
# downloadable artifact, so reviewers can open a PR's docs without a local Ruby setup. Nothing is
# deployed: the job is read-only and also works for fork PRs. It doubles as a build check, because
# GitHub Pages builds the gh-pages branch itself and only reports a broken build after merge.
#
# Same-repository PRs get one `<!-- docs-preview -->` comment, updated in place, with the download
# link, the changed pages and how to view them. Local alternative: the previewing-docs-site skill.

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - 'docs/**'
            - '.github/skills/previewing-docs-site/scripts/Gemfile'
            - '.github/workflows/docs-preview.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: 'Docs: build site'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            artifact-url: ${{ steps.upload.outputs.artifact-url }}
        env:
            BUNDLE_GEMFILE: ${{ github.workspace }}/.github/skills/previewing-docs-site/scripts/Gemfile
        steps:
            - name: ✅ Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 💎 Set up Ruby and the GitHub Pages gems
              uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
              with:
                  ruby-version: '3.3'
                  bundler-cache: true

            # An empty base URL lets the site run from the root of any local web server.
            - name: 🔨 Build the site
              env:
                  JEKYLL_ENV: production
                  PAGES_REPO_NWO: ${{ github.repository }}
                  JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  echo "baseurl: ''" > "$RUNNER_TEMP/preview.yml"
                  bundle exec jekyll build --source docs --destination _site --config "docs/_config.yml,$RUNNER_TEMP/preview.yml"

            - name: 📤 Upload the site
              id: upload
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: docs-preview-pr-${{ github.event.pull_request.number }}
                  path: _site
                  retention-days: 14
                  if-no-files-found: error

    comment:
        name: 'Docs: PR comment'
        needs: [build]
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
            pull-requests: write
        steps:
            - name: Post or update the docs preview comment
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  RESULT: ${{ needs.build.result }}
                  ARTIFACT_URL: ${{ needs.build.outputs.artifact-url }}
              with:
                  script: |
                      const MARKER = '<!-- docs-preview -->';
                      const pr = context.payload.pull_request;
                      const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
                      // A newer push started its own run; leave the comment to that run.
                      if (current.head.sha !== pr.head.sha) return;

                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const result = process.env.RESULT;
                      const artifact = `docs-preview-pr-${pr.number}`;
                      const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });
                      // Only index.md, user-manual/ and release-notes/ are published (see docs/_config.yml).
                      const pages = files
                        .filter((f) => f.status !== 'removed' && /^docs\/(index\.md|(user-manual|release-notes)\/[^/]+\.md|(user-manual|release-notes)\.md)$/.test(f.filename))
                        .map((f) => f.filename.slice('docs/'.length).replace(/\.md$/, '.html'))
                        .sort();
                      const images = files.filter((f) => /^docs\/.*\.(png|jpe?g|gif|svg|webp)$/i.test(f.filename)).length;
                      const styles = files.some((f) => /^docs\/(_sass|_includes|_layouts|assets)\/|^docs\/_config\.yml$/.test(f.filename));

                      const lines = [MARKER];
                      if (result === 'success') {
                        lines.push(
                          '## ✅ Docs preview ready',
                          '',
                          `Commit \`${pr.head.sha.slice(0, 7)}\`, [workflow run](${runUrl}).`,
                          '',
                          `**[Download \`${artifact}.zip\`](${process.env.ARTIFACT_URL})** (kept for 14 days), unzip it, then from the unzipped folder run:`,
                          '',
                          '```bash',
                          'python -m http.server 8000',
                          '```',
                          '',
                          'and open http://localhost:8000/. The site follows your OS light or dark setting.',
                        );
                        if (pages.length) {
                          lines.push('', `### Changed pages (${pages.length})`, '', ...pages.map((p) => `- [\`${p.replace(/\.html$/, '')}\`](http://localhost:8000/${p})`));
                        }
                        const notes = [];
                        if (images) notes.push(`${images} image${images === 1 ? '' : 's'} changed`);
                        if (styles) notes.push('site styles, layout or configuration changed, so check a few unchanged pages too');
                        if (notes.length) lines.push('', `_Also: ${notes.join('; ')}._`);
                      } else if (result === 'failure') {
                        lines.push(
                          '## ❌ Docs build failed',
                          '',
                          `Commit \`${pr.head.sha.slice(0, 7)}\`, [workflow run](${runUrl}).`,
                          '',
                          'The **Build the site** step in the workflow run has the error. If it is a Jekyll error in `docs/`, GitHub Pages would fail to publish this version after merge; reproduce it locally with the `previewing-docs-site` skill.',
                        );
                      } else {
                        lines.push('## ⏭️ Docs preview not built', '', `The build was ${result}. [Workflow run](${runUrl}).`);
                      }
                      lines.push('', '_Updated in place on every run._');
                      const body = lines.join('\n');

                      const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number, per_page: 100 });
                      const existing = comments.find((comment) => comment.body?.includes(MARKER));
                      if (existing) {
                        await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                      } else {
                        await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
                      }
