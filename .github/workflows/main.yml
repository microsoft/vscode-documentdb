name: CI

# This workflow handles the following scenarios:
#
# 1. Push to `main`:
#    - Runs all jobs: code checks, tests, packaging, and caches build sizes
#      for PR comparisons
#
# 2. Pull Requests to `main`, `release/**`, or `feature/**`:
#    - Runs all jobs: code checks, unit tests, packaging, and VSIX verification
#    - Posts PR comments with code quality report and build size comparison
#
# 3. Manual run via `workflow_dispatch`:
#    - Optional `enforce_full_run` input forces packaging and VSIX verification on any branch

on:
    workflow_dispatch:
        inputs:
            enforce_full_run:
                description: 'Run packaging and VSIX verification jobs on manual dispatch'
                required: false
                type: boolean
                default: false

    push:
        branches:
            - main

    pull_request:
        branches:
            - main
            - release/**
            - feature/**

concurrency:
    group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
    cancel-in-progress: true

jobs:
    code-quality-and-tests:
        name: Code Quality & Tests
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        defaults:
            run:
                working-directory: '.'
        steps:
            - name: ✅ Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🛠 Setup Node.js Environment (with cache)
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: '**/package-lock.json'

            - name: 📦 Install Dependencies (npm ci)
              run: npm ci --prefer-offline --no-audit --no-fund --progress=false --verbose

            - name: 🔨 Build Workspace Packages
              run: npm run build --workspaces --if-present

            - name: 🌐 Check Localization Files
              id: l10n
              continue-on-error: true
              run: npm run l10n:check

            - name: 🧹 Run ESLint
              id: lint
              continue-on-error: true
              run: npm run lint

            - name: 🎨 Check Code Formatting (Prettier)
              id: prettier
              continue-on-error: true
              run: npm run prettier

            - name: 🧪 Run Unit Tests (Vitest)
              run: npm test

            - name: 💬 Post PR Code Quality Report
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const results = {
                        l10n:     '${{ steps.l10n.outcome }}',
                        lint:     '${{ steps.lint.outcome }}',
                        prettier: '${{ steps.prettier.outcome }}',
                      };
                      const labels = {
                        l10n:     'Localization (`l10n`)',
                        lint:     'ESLint',
                        prettier: 'Prettier formatting',
                      };
                      const hints = {
                        l10n:     'Run `npm run l10n` and commit the updated files.',
                        lint:     'Run `npm run lint` and fix the reported issues.',
                        prettier: 'Run `npm run prettier-fix` to auto-format, then commit.',
                      };

                      const marker = '<!-- code-quality-report -->';
                      const failed = Object.keys(results).filter(k => results[k] === 'failure');
                      const rows = Object.keys(results).map(k => {
                        const ok = results[k] === 'success';
                        const status = ok ? '✅ Passed' : '❌ Failed';
                        const hint = ok ? '' : hints[k];
                        return `| ${labels[k]} | ${status} | ${hint} |`;
                      }).join('\n');

                      const title = failed.length === 0
                        ? '## ✅ Code Quality Checks'
                        : '## ⚠️ Code Quality Issues';

                      const body = [
                        marker,
                        title,
                        '',
                        '| Check | Status | How to fix |',
                        '|-------|--------|------------|',
                        rows,
                        '',
                        '_This comment is updated automatically on each push._',
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });
                      const existing = comments.find(c => c.body && c.body.includes(marker));
                      if (existing) {
                        await github.rest.issues.deleteComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                        });
                      }
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        body,
                      });
            - name: ❌ Fail if code quality checks failed
              if: steps.l10n.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.prettier.outcome == 'failure'
              run: |
                  echo "One or more code quality checks failed (l10n=${{ steps.l10n.outcome }}, lint=${{ steps.lint.outcome }}, prettier=${{ steps.prettier.outcome }})"
                  exit 1

    vsix-inspection:
        name: VSIX inspection (L1)
        runs-on: ubuntu-latest
        needs: [build-and-package]
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci --prefer-offline --no-audit --no-fund --progress=false
            - run: npm run build --workspaces --if-present
            - name: Test verification tooling
              run: npm run test:verification
            - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: Artifacts-${{ github.run_id }}
                  path: verification-artifacts
            - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: Bundle-reports-${{ github.run_id }}
                  path: build/verification/reports
            - name: Inspect production VSIX and prove failures
              id: inspect
              run: |
                  mapfile -t packages < <(find verification-artifacts -name '*.vsix' -type f)
                  test "${#packages[@]}" -eq 1
                  npm run verify:vsix -- "${packages[0]}" --manifest-report verification-artifacts/l1-manifest-report.json
                  npm run prove:vsix -- "${packages[0]}"
            - name: Upload L1 manifest report
              id: l1-report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: L1-manifest-report-${{ github.run_id }}
                  path: verification-artifacts/l1-manifest-report.json
                  if-no-files-found: warn

            - name: 📥 Restore base branch sizes (PR only)
              if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              id: base-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: build-sizes.json
                  key: build-sizes-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.base.sha }}
                  restore-keys: |
                      build-sizes-${{ github.event.pull_request.base.ref }}-

            - name: 📐 Prepare base sizes for comparison
              if: always() && steps.base-cache.outcome == 'success' && steps.base-cache.outputs.cache-matched-key
              run: mv build-sizes.json base-sizes.json

            - name: 📐 Collect L1 graph sizes
              if: always() && hashFiles('verification-artifacts/l1-manifest-report.json') != ''
              run: node build/verification/build-size-report.cjs verification-artifacts/l1-manifest-report.json build-sizes.json

            - name: 💾 Cache build sizes (push only)
              if: success() && github.event_name == 'push'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: build-sizes.json
                  key: build-sizes-${{ github.ref_name }}-${{ github.sha }}

            - name: 💬 Post PR Build Size Report
              if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  L1_OUTCOME: ${{ steps.inspect.outcome }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
                  VSIX_URL: ${{ needs.build-and-package.outputs.vsix-url }}
                  BUNDLE_URL: ${{ needs.build-and-package.outputs.bundle-url }}
                  L1_URL: ${{ steps.l1-report.outputs.artifact-url }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('node:fs');
                      const { buildSizeComment } = require('./build/verification/build-size-report.cjs');
                      const reportFile = 'verification-artifacts/l1-manifest-report.json';
                      const report = fs.existsSync(reportFile) ? JSON.parse(fs.readFileSync(reportFile, 'utf8')) : null;
                      const base = fs.existsSync('base-sizes.json') ? JSON.parse(fs.readFileSync('base-sizes.json', 'utf8')) : null;
                      const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
                      const body = buildSizeComment(report, base, {
                        outcome: process.env.L1_OUTCOME,
                        baseRef: process.env.BASE_REF,
                        runId: process.env.GITHUB_RUN_ID,
                        runUrl,
                        vsixUrl: process.env.VSIX_URL,
                        bundleUrl: process.env.BUNDLE_URL,
                        l1Url: process.env.L1_URL,
                      });
                      await core.summary.addRaw(body).write();
                      const comments = await github.paginate(github.rest.issues.listComments, {
                        ...context.repo,
                        issue_number: context.issue.number,
                      });
                      const existing = comments.find(c => c.body && c.body.includes('<!-- build-size-report -->'));
                      if (existing) {
                        await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                      } else {
                        await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
                      }

    vsix-activation:
        name: Installed VSIX activation (L3)
        runs-on: ubuntu-latest
        needs: [build-and-package]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci --prefer-offline --no-audit --no-fund --progress=false
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .vscode-test/
                  key: vscode-activation-${{ runner.os }}-${{ hashFiles('package.json', 'build/verification/activation/**') }}
            - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: Artifacts-${{ github.run_id }}
                  path: verification-artifacts
            - name: Activate installed VSIX and prove partial-activation failure
              env:
                  TMPDIR: ${{ runner.temp }}
              run: |
                  mapfile -t packages < <(find verification-artifacts -name '*.vsix' -type f)
                  test "${#packages[@]}" -eq 1
                  xvfb-run -a npm run test:vsix -- "${packages[0]}"
                  xvfb-run -a npm run prove:activation -- "${packages[0]}"

            - name: Upload activation failure diagnostics
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: Activation-diagnostics-${{ github.run_id }}
                  path: |
                      ${{ runner.temp }}/documentdb-l3-*/**/*.log
                      ${{ runner.temp }}/documentdb-l3-*/log-report.json
                  if-no-files-found: warn

    # Run on push to `main`/`release/**` (for cache seeding) and for PRs to main/release/**
    build-and-package:
        name: Build & Package
        runs-on: ubuntu-latest
        needs: [code-quality-and-tests]
        permissions:
            contents: read
        outputs:
            vsix-url: ${{ steps.artifacts.outputs.artifact-url }}
            bundle-url: ${{ steps.bundle-reports.outputs.artifact-url }}
        if: |
            (github.event_name == 'workflow_dispatch' && inputs.enforce_full_run) ||
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/heads/release/') ||
            (startsWith(github.ref, 'refs/pull/') && (
              github.base_ref == 'main' ||
              startsWith(github.base_ref, 'release/')
            ))
        defaults:
            run:
                working-directory: '.'
        steps:
            - name: ✅ Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🛠 Setup Node.js Environment (with cache)
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: '**/package-lock.json'

            - name: 📦 Install Dependencies (npm ci)
              run: npm ci --prefer-offline --no-audit --no-fund --progress=false

            - name: 🏗 Build Project
              run: npm run build

            - name: 📦 Package Distributables (vsix/tgz)
              run: npm run package
              env:
                  BUNDLE_ANALYZE: 'true'

            - name: 📤 Upload Artifacts
              id: artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: Artifacts-${{ github.run_id }}
                  path: |
                      **/*.vsix
                      **/*.tgz
                      !**/node_modules

            - name: Upload bundle verification reports
              id: bundle-reports
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: Bundle-reports-${{ github.run_id }}
                  path: build/verification/reports/*.json
                  if-no-files-found: error
